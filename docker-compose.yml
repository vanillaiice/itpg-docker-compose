services:
  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    expose:
      - 6379
    networks:
      - server

  itpg_server:
    image: "ghcr.io/vanillaiice/itpg:0.7.5-golang1.23.1-alpine"
    restart: unless-stopped
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=password
      - ADMIN_EMAIL=admin@admin.com
    ports:
      - 5555:5555
    command: "--load data/config.toml"
    depends_on:
      - redis
    networks:
      - server
    volumes:
      - ./data:/data

  itpg_frontend:
    build:
      context: "https://github.com/vanillaiice/itpg-frontend.git"
      args:
        - API_URL=http://localhost:5555
    restart: unless-stopped
    environment:
      - ORIGIN=http://localhost:9999
      - ADAPTER=bun
      - PORT=9999
    ports:
      - 9999:9999
    depends_on:
      - itpg_server

networks:
  server: {}
